<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生命仪表盘 // Life Dashboard</title>
<style>
:root{--cyan:#00f0ff;--magenta:#ff00e5;--bg:#05060a;--panel:rgba(10,14,24,.65);
  --line:rgba(0,240,255,.25);--text:#d6f7ff;--muted:#7c8ba1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;padding:28px 16px 60px;overflow-x:hidden}
a{color:var(--cyan);text-decoration:none}
/* 扫描线 */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,240,255,.025) 3px,transparent 4px)}
.back{display:inline-block;margin:0 auto 20px;font-family:"Courier New",monospace;font-size:13px;
  letter-spacing:1px;opacity:.8}
.back:hover{text-shadow:0 0 8px var(--cyan)}
.wrap{max-width:560px;margin:0 auto}
h1{text-align:center;font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:2px;margin-bottom:4px;
  color:#fff;text-shadow:0 0 18px rgba(0,240,255,.5)}
h1 b{color:var(--cyan)}
.subtitle{text-align:center;color:var(--magenta);font-family:"Courier New",monospace;font-size:12px;
  letter-spacing:3px;margin-bottom:26px;text-shadow:0 0 8px var(--magenta)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;
  margin-bottom:18px;position:relative;overflow:hidden;backdrop-filter:blur(6px)}
.panel::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;
  background:linear-gradient(90deg,var(--cyan),var(--magenta))}
label{display:block;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;
  font-family:"Courier New",monospace}
input[type=date]{width:100%;padding:15px 16px;background:rgba(0,240,255,.05);border:1px solid var(--line);
  border-radius:10px;color:var(--text);font-size:16px;outline:none;color-scheme:dark;transition:.2s}
input[type=date]:focus{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.25)}
.btn{width:100%;margin-top:14px;padding:15px;background:linear-gradient(90deg,var(--cyan),var(--magenta));
  color:#02121a;border:none;border-radius:10px;font-size:16px;font-weight:800;letter-spacing:2px;
  cursor:pointer;transition:.2s}
.btn:hover{box-shadow:0 0 26px rgba(0,240,255,.5);transform:translateY(-2px)}
#out{display:none}
#out.show{display:block;animation:fade .6s ease}
@keyframes fade{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* 核心大数字 */
.hero-stat{text-align:center;padding:6px 0 4px}
.hero-stat .num{font-size:clamp(40px,12vw,64px);font-weight:900;line-height:1;
  color:var(--cyan);text-shadow:0 0 24px rgba(0,240,255,.5);font-variant-numeric:tabular-nums}
.hero-stat .lbl{color:var(--muted);font-family:"Courier New",monospace;font-size:13px;
  letter-spacing:2px;margin-top:8px}
/* 小统计网格 */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.stat{background:rgba(0,240,255,.04);border:1px solid var(--line);border-radius:10px;padding:14px 12px;text-align:center}
.stat .v{font-size:22px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--muted);letter-spacing:1px;margin-top:4px;font-family:"Courier New",monospace}
/* 人生进度条 */
.progress-head{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);
  font-family:"Courier New",monospace;margin-bottom:8px}
.progress-head b{color:var(--cyan)}
.pbar{height:12px;background:rgba(0,240,255,.1);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pbar span{display:block;height:100%;width:0;border-radius:8px;
  background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 14px var(--cyan);
  transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
/* 里程碑时间轴 */
.mtitle{font-size:13px;color:var(--magenta);letter-spacing:2px;font-family:"Courier New",monospace;
  margin-bottom:14px;text-shadow:0 0 8px var(--magenta)}
.mile{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed rgba(0,240,255,.12)}
.mile:last-child{border-bottom:none}
.mile .dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--muted)}
.mile.passed .dot{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.mile.next .dot{background:var(--magenta);box-shadow:0 0 12px var(--magenta);animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.5);opacity:.6}}
.mile .info{flex:1}
.mile .info .d{font-size:15px;font-weight:700;color:#fff}
.mile.passed .info .d{color:var(--cyan)}
.mile .info .sub{font-size:12px;color:var(--muted);font-family:"Courier New",monospace}
.mile .badge{font-size:11px;font-family:"Courier New",monospace;letter-spacing:1px;padding:3px 8px;
  border-radius:20px;border:1px solid var(--line)}
.mile.passed .badge{color:var(--cyan)}
.mile.next .badge{color:var(--magenta);border-color:rgba(255,0,229,.4)}
.tip{text-align:center;color:var(--muted);font-size:12px;margin-top:8px;font-family:"Courier New",monospace}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="../index.html">← 返回主页</a>
  <h1>生命 <b>仪表盘</b></h1>
  <div class="subtitle">// LIFE DASHBOARD</div>

  <div class="panel">
    <label>输入你的出生日期 // BIRTH DATE</label>
    <input type="date" id="birth">
    <button class="btn" onclick="calc()">▶ 生成我的生命数据</button>
    <div class="tip">数据仅在你的浏览器本地计算，不上传</div>
  </div>

  <div id="out">
    <!-- 已活天数大数字 -->
    <div class="panel hero-stat">
      <div class="num" id="daysAlive">0</div>
      <div class="lbl">DAYS ALIVE // 你已经度过的天数</div>
    </div>

    <!-- 小统计 -->
    <div class="panel">
      <div class="stats">
        <div class="stat"><div class="v" id="ageExact">-</div><div class="k">精确年龄</div></div>
        <div class="stat"><div class="v" id="weeks">-</div><div class="k">总周数</div></div>
        <div class="stat"><div class="v" id="nextBday">-</div><div class="k">距下次生日</div></div>
        <div class="stat"><div class="v" id="bornWeek">-</div><div class="k">出生那天是</div></div>
      </div>
    </div>

    <!-- 人生进度条 -->
    <div class="panel">
      <div class="progress-head"><span>人生进度 // 以 <b id="lifeExp">80</b> 岁计</span><b id="pctText">0%</b></div>
      <div class="pbar"><span id="pbar"></span></div>
    </div>

    <!-- 里程碑时间轴 -->
    <div class="panel">
      <div class="mtitle">// 天数里程碑 MILESTONES</div>
      <div id="miles"></div>
    </div>

    <!-- 趣味统计 -->
    <div class="panel">
      <div class="mtitle">// 趣味统计 FUN FACTS</div>
      <div class="stats">
        <div class="stat"><div class="v" id="heart">-</div><div class="k">心跳约(次)</div></div>
        <div class="stat"><div class="v" id="breath">-</div><div class="k">呼吸约(次)</div></div>
        <div class="stat"><div class="v" id="sleep">-</div><div class="k">睡觉约(天)</div></div>
        <div class="stat"><div class="v" id="moons">-</div><div class="k">经历满月(次)</div></div>
      </div>
    </div>
  </div>
</div>

<script>
const WEEK=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const LIFE_EXPECT_YEARS=80; // 人生进度按 80 岁算，可改

function fmt(n){return n.toLocaleString('en-US')}
function dateStr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function animateNum(el,target){
  let start=0;const dur=900,t0=performance.now();
  (function step(t){const p=Math.min((t-t0)/dur,1);
    el.textContent=fmt(Math.floor((target)*(1-Math.pow(1-p,3))));
    if(p<1)requestAnimationFrame(step);else el.textContent=fmt(target);
  })(t0);
}

function calc(){
  const v=document.getElementById('birth').value;
  if(!v){alert('请先选择出生日期');return}
  const birth=new Date(v+'T00:00:00');
  const now=new Date();
  if(birth>now){alert('出生日期不能晚于今天');return}
  const MS=86400000;
  const daysAlive=Math.floor((now-birth)/MS);

  // 精确年龄
  let ay=now.getFullYear()-birth.getFullYear();
  let am=now.getMonth()-birth.getMonth();
  let ad=now.getDate()-birth.getDate();
  if(ad<0){am--;const pm=new Date(now.getFullYear(),now.getMonth(),0).getDate();ad+=pm;}
  if(am<0){ay--;am+=12;}

  // 下次生日
  let nb=new Date(now.getFullYear(),birth.getMonth(),birth.getDate());
  if(nb<now)nb=new Date(now.getFullYear()+1,birth.getMonth(),birth.getDate());
  const toBday=Math.ceil((nb-now)/MS);

  // 显示
  document.getElementById('out').classList.add('show');
  animateNum(document.getElementById('daysAlive'),daysAlive);
  document.getElementById('ageExact').textContent=ay+'岁'+am+'月';
  document.getElementById('weeks').textContent=fmt(Math.floor(daysAlive/7));
  document.getElementById('nextBday').textContent=toBday+'天';
  document.getElementById('bornWeek').textContent=WEEK[birth.getDay()];

  // 进度条
  const totalDays=LIFE_EXPECT_YEARS*365.25;
  const pct=Math.min(100,(daysAlive/totalDays*100));
  document.getElementById('lifeExp').textContent=LIFE_EXPECT_YEARS;
  setTimeout(()=>{document.getElementById('pbar').style.width=pct+'%';},100);
  document.getElementById('pctText').textContent=pct.toFixed(1)+'%';

  // 里程碑
  const marks=[1000,3000,5000,7300,10000,15000,20000,25000,30000];
  const labels={7300:'≈20岁',10000:'🎂 万日',20000:'≈55岁',30000:'≈82岁'};
  let nextFound=false;
  const box=document.getElementById('miles');box.innerHTML='';
  marks.forEach(m=>{
    const d=new Date(birth.getTime()+m*MS);
    const passed=m<=daysAlive;
    const isNext=!passed&&!nextFound;if(isNext)nextFound=true;
    const el=document.createElement('div');
    el.className='mile'+(passed?' passed':'')+(isNext?' next':'');
    const remain=passed?'':' · 还有'+fmt(m-daysAlive)+'天';
    el.innerHTML='<div class="dot"></div><div class="info">'+
      '<div class="d">第 '+fmt(m)+' 天 '+(labels[m]?'<span style="color:var(--magenta);font-size:12px">'+labels[m]+'</span>':'')+'</div>'+
      '<div class="sub">'+dateStr(d)+' '+WEEK[d.getDay()]+remain+'</div></div>'+
      '<div class="badge">'+(passed?'已达成':isNext?'下一个':'未来')+'</div>';
    box.appendChild(el);
  });

  // 趣味统计（粗略估算）
  document.getElementById('heart').textContent=fmt(Math.round(daysAlive*24*60*70/1e6))+'百万';
  document.getElementById('breath').textContent=fmt(Math.round(daysAlive*24*60*16/1e4))+'万';
  document.getElementById('sleep').textContent=fmt(Math.round(daysAlive/3));
  document.getElementById('moons').textContent=fmt(Math.floor(daysAlive/29.53));

  document.getElementById('out').scrollIntoView({behavior:'smooth',block:'nearest'});
}
</script>
</body>
</html>
