<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙年龄换算器 // Cosmic Age</title>
<style>
:root{--cyan:#00f0ff;--magenta:#ff00e5;--bg:#05060a;--panel:rgba(10,14,24,.65);
  --line:rgba(0,240,255,.25);--text:#d6f7ff;--muted:#7c8ba1}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",-apple-system,"Microsoft YaHei",sans-serif;background:var(--bg);
  color:var(--text);min-height:100vh;padding:28px 16px 60px;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;
  background:repeating-linear-gradient(0deg,transparent 0,transparent 2px,rgba(0,240,255,.025) 3px,transparent 4px)}
a{color:var(--cyan);text-decoration:none}
.back{display:block;max-width:560px;margin:0 auto 20px;font-family:"Courier New",monospace;font-size:13px;opacity:.8}
.back:hover{text-shadow:0 0 8px var(--cyan)}
.wrap{max-width:560px;margin:0 auto}
h1{text-align:center;font-size:clamp(24px,6vw,34px);font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 18px rgba(0,240,255,.5)}
h1 b{color:var(--cyan)}
.subtitle{text-align:center;color:var(--magenta);font-family:"Courier New",monospace;font-size:12px;letter-spacing:3px;margin:6px 0 26px;text-shadow:0 0 8px var(--magenta)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;position:relative;overflow:hidden;backdrop-filter:blur(6px)}
.panel::before{content:"";position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,var(--cyan),var(--magenta))}
label{display:block;font-size:13px;color:var(--muted);letter-spacing:1px;margin-bottom:10px;font-family:"Courier New",monospace}
input[type=date]{width:100%;padding:15px 16px;background:rgba(0,240,255,.05);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:16px;outline:none;color-scheme:dark}
input[type=date]:focus{border-color:var(--cyan);box-shadow:0 0 16px rgba(0,240,255,.25)}
.btn{width:100%;margin-top:14px;padding:15px;background:linear-gradient(90deg,var(--cyan),var(--magenta));color:#02121a;border:none;border-radius:10px;font-size:16px;font-weight:800;letter-spacing:2px;cursor:pointer;transition:.2s}
.btn:hover{box-shadow:0 0 26px rgba(0,240,255,.5);transform:translateY(-2px)}
#out{display:none}#out.show{display:block;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.row{display:flex;align-items:baseline;gap:12px;padding:16px 0;border-bottom:1px dashed rgba(0,240,255,.12)}
.row:last-child{border-bottom:none}
.row .ic{font-size:24px;flex:0 0 30px}
.row .body{flex:1}
.row .v{font-size:22px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(0,240,255,.3)}
.row .k{font-size:13px;color:var(--muted);margin-top:3px}
.tri{text-align:center;color:var(--magenta);font-size:15px;margin-top:6px;line-height:1.7;font-weight:600}
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<div class="wrap">
  <h1>宇宙 <b>年龄换算器</b></h1>
  <div class="subtitle">// COSMIC AGE CALCULATOR</div>
  <div class="panel">
    <label>输入出生日期 // BIRTH DATE</label>
    <input type="date" id="birth" min="1900-01-01">
    <button class="btn" onclick="calc()">🌌 换算我的宇宙尺度</button>
  </div>
  <div id="out">
    <div class="panel" id="rows"></div>
    <div class="panel"><div class="tri" id="tri"></div></div>
  </div>
</div>
<script>
// 把日期框上限设为今天：限制年份为 4 位（输满 4 位自动跳月份），也禁止选未来
(function(){const t=new Date();document.getElementById('birth').max=
  t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');})();
function fmt(n){return Math.round(n).toLocaleString('en-US')}
function calc(){
  const v=document.getElementById('birth').value;
  if(!v){alert('请先选择出生日期');return}
  const birth=new Date(v+'T00:00:00'),now=new Date();
  if(birth>now){alert('出生日期不能晚于今天');return}
  const secs=(now-birth)/1000, days=secs/86400, years=days/365.25;
  // 各种宇宙尺度换算
  const rows=[
    ['🌍','你已绕太阳公转 <span class="v">'+fmt(years)+'</span> 圈','每一圈都是一整年的旅程'],
    ['🔄','地球带你自转了 <span class="v">'+fmt(days)+'</span> 圈','你看过这么多次日出的机会'],
    ['💡','光从你出生起已飞行 <span class="v">'+fmt(years)+'</span> 光年','年龄的年数 = 光年数，刚好相等'],
    ['🌀','随太阳绕银河系飞行约 <span class="v">'+fmt(secs*230/1e8)+'</span> 亿公里','太阳以 230 km/s 绕银心狂奔'],
    ['🚀','相对宇宙微波背景已移动约 <span class="v">'+fmt(secs*370/1e8)+'</span> 亿公里','你从未真正静止过'],
    ['❤️','心脏大约跳动了 <span class="v">'+fmt(secs/60*70/1e6)+'</span> 百万次','按每分钟 70 次估算']
  ];
  document.getElementById('rows').innerHTML=rows.map(r=>
    '<div class="row"><div class="ic">'+r[0]+'</div><div class="body"><div>'+r[1]+'</div><div class="k">'+r[2]+'</div></div></div>').join('');
  // 三体梗
  const cycles=Math.floor(days/137);
  document.getElementById('tri').innerHTML='👽 换算到三体世界：<br>你已经历约 <b style="color:#00f0ff">'+cycles+'</b> 次乱纪元，<br>脱水浸泡 <b style="color:#00f0ff">'+cycles+'</b> 回合，至今仍未被烈日烤干。';
  document.getElementById('out').classList.add('show');
}
</script>
</body>
</html>
